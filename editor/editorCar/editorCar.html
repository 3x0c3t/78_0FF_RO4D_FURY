<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Éditeur de Véhicule - OFF ROAD FURY</title>
  <link rel="stylesheet" href="editorCar.css">
</head>
<body>

<div id="app">

  <h1>ÉDITEUR DE VÉHICULE</h1>

  <div class="editor-container">

    <!-- COLONNE GAUCHE : menu -->
    <div class="menu-column">

      <!-- Importer un véhicule -->
      <input type="file" id="import-car" accept=".json" style="margin-bottom:10px; display:block;">

      <!-- Choisir le type de véhicule -->
      <div class="menu-line">
        <div class="menu-title">Type de véhicule :</div>
        <select id="car-type">
          <option value="car01">Car01</option>
          <option value="4x4">4x4</option>
          <option value="buggy">Buggy</option>
          <option value="truck">Truck</option>
        </select>
      </div>

      <!-- Choisir couleur -->
      <div class="menu-line">
        <div class="menu-title">Couleur :</div>
        <input type="color" id="car-color" value="#ff0000">
      </div>

      <!-- ===== ROUE ===== -->
      <div class="menu-line">
        <div class="menu-title">Roue (position)</div>

        <label>
          X
          <input id="wheel-x" type="number" step="0.1" value="1">
        </label>

        <label>
          Y
          <input id="wheel-y" type="number" step="0.1" value="0.4">
        </label>

        <label>
          Z
          <input id="wheel-z" type="number" step="0.1" value="1">
        </label>

        <div id="wheel-coords"
             style="margin-top:6px;font-size:12px;color:#555;">
          X:0 Y:0 Z:0
        </div>
      </div>

    </div>

    <!-- COLONNE DROITE : aperçu -->
    <div class="preview-column">
      <canvas id="car-canvas"></canvas>
    </div>

  </div>

  <div class="bottom-buttons">
    <button id="save">SAUVEGARDER</button>
    <button id="back">RETOUR</button>
  </div>

</div>

<script type="module" src="editorCar.js"></script>
</body>
</html>
