<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Éditeur de Véhicule - OFF ROAD FURY</title>
  <link rel="stylesheet" href="editorCar.css">
</head>
<body>

<div id="app">

  <h1>ÉDITEUR DE VÉHICULE</h1>

  <div class="editor-container">

    <!-- MENU -->
    <div class="menu-column">

      <input type="file" id="import-car" accept=".json">

      <div class="menu-line">
        <div class="menu-title">Type de véhicule</div>
        <select id="car-type">
          <option value="car01">Car01</option>
          <option value="4x4">4x4</option>
          <option value="buggy">Buggy</option>
          <option value="truck">Truck</option>
        </select>
      </div>

      <div class="menu-line">
        <div class="menu-title">Couleur</div>
        <input type="color" id="car-color" value="#ff0000">
      </div>

      <div class="menu-title">Dimensions</div>
      <div class="menu-line">
        <label>Largeur
          <input type="number" id="car-size-x" step="0.1" value="3">
        </label>
        <label>Hauteur
          <input type="number" id="car-size-y" step="0.1" value="0.8">
        </label>
        <label>Longueur
          <input type="number" id="car-size-z" step="0.1" value="1.6">
        </label>
      </div>

      <div class="menu-title">Suspensions</div>
      <div class="menu-line">
        <label>Hauteur repos
          <input type="number" id="suspension-rest" step="0.05" value="0.4">
        </label>
        <label>Débattement
          <input type="number" id="suspension-travel" step="0.05" value="0.3">
        </label>
        <label>Compression
          <input type="number" id="suspension-compression" step="0.05" value="0">
        </label>
      </div>

    </div>

    <!-- APERÇU 3D -->
    <div class="preview-column">
      <canvas id="car-canvas"></canvas>
    </div>

  </div>

  <!-- BOUTONS EN BAS -->
  <div class="bottom-buttons">
    <button id="save">SAUVEGARDER</button>
    <button id="back">RETOUR</button>
  </div>

</div>

<script type="module" src="editorCar.js"></script>
</body>
</html>
